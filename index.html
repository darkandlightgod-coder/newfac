<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大江生醫 (TCI) 海外新建擴廠專案篩選決策矩陣</title>
    <!-- 引入 Apache ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }
        #chart-container {
            width: 100%;
            height: 650px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="chart-container"></div>
</div>

<script>
    var chartDom = document.getElementById('chart-container');
    var myChart = echarts.init(chartDom);
    var option;

    // 專案數據資料集 (全球新建評估與替代方案)
    const projects = [
        '馬來西亞 雪蘭莪\n(Greenfield自建)', 
        '泰國 羅勇\n(Greenfield自建)', 
        '波蘭 羅茲\n(Greenfield自建)', 
        '越南 平陽\n(Greenfield自建)', 
        '墨西哥 新萊昂\n(Greenfield自建)', 
        '日本 關西\n(CMO戰略代工)'
    ];
    
    // 決策狀態標籤
    const statusLabels = [
        '有條件推進 (需精算太陽能CAPEX與缺工對策)', 
        '擱置 (綠電取得成本過高)', 
        '擱置 (極端通膨與高CAPEX摧毀經濟性)', 
        '強制擱置 (智權、綠電與金流管制硬傷)', 
        '警戒撤出 / 重大條件重議 (缺水與安保危機)',
        '優先推進 (暫定，待C2壓力測試與合約覆核)'
    ];
    
    // 各維度數據
    const dataA = [10, 10, 15, 10, 15, 15]; // A. 關稅避險
    const dataB = [15, 10, 15, 5, 10, 15];  // B. 智權護城河
    const dataC = [35, 35, 25, 33, 25, 40]; // C. 財務專屬模組
    const dataD = [20, 20, 25, 18, 10, 25]; // D. 永續與營運基建
    const dataRisk = [0, -5, -10, -5, -10, 0]; // 客觀風險扣分 (加權通膨曝險)

    // 計算最終總分
    const totalScores = projects.map((_, i) => {
        return dataA[i] + dataB[i] + dataC[i] + dataD[i] + dataRisk[i];
    });

    option = {
        title: {
            text: '大江生醫 (TCI) 海外新建擴廠專案篩選決策矩陣',
            subtext: '最終實戰核准版：全球 Greenfield 評比與戰略替代方案',
            left: 'center',
            textStyle: { fontSize: 20, fontWeight: 'bold', color: '#1a1a1a' },
            subtextStyle: { fontSize: 13, color: '#666666' }
        },
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            formatter: function (params) {
                let index = params[0].dataIndex;
                let res = `<div style="padding: 5px;"><strong>${projects[index].replace('\n',' ')}</strong><br/>`;
                let sum = 0;
                params.forEach(item => {
                    let val = item.value;
                    res += `${item.marker} ${item.seriesName}: <span style="float:right; margin-left:15px; font-weight:bold;">${val} 分</span><br/>`;
                    sum += val;
                });
                res += `<hr style="margin:10px 0; border:0; border-top:1px solid #ccc;"/>`;
                res += `<div style="font-size: 15px; color: #333;">🎯 最終積分: <strong>${sum} 分</strong></div>`;
                res += `<div style="font-size: 13px; color: #d35400; margin-top: 5px; max-width: 250px; white-space: normal;">⚠️ 決策: ${statusLabels[index]}</div></div>`;
                return res;
            }
        },
        legend: {
            top: '12%',
            data: ['A. 關稅與貿易避險 (15)', 'B. 商業與智權護城河 (15)', 'C. 財務專屬模組 (45)', 'D. 永續與營運基建 (25)', '客觀風險扣分']
        },
        grid: {
            left: '3%',
            right: '4%',
            bottom: '8%',
            top: '25%',
            containLabel: true
        },
        xAxis: {
            type: 'category',
            data: projects,
            axisLabel: { interval: 0, fontWeight: 'bold', fontSize: 12, lineHeight: 18 }
        },
        yAxis: {
            type: 'value',
            name: '評估積分 (Score)',
            min: -20,
            max: 110,
            splitLine: { lineStyle: { type: 'dashed' } }
        },
        series: [
            {
                name: 'A. 關稅與貿易避險 (15)',
                type: 'bar',
                stack: 'Total',
                color: '#2b5c8f',
                barWidth: '40%',
                data: dataA
            },
            {
                name: 'B. 商業與智權護城河 (15)',
                type: 'bar',
                stack: 'Total',
                color: '#41b883',
                data: dataB
            },
            {
                name: 'C. 財務專屬模組 (45)',
                type: 'bar',
                stack: 'Total',
                color: '#f5a623',
                data: dataC
            },
            {
                name: 'D. 永續與營運基建 (25)',
                type: 'bar',
                stack: 'Total',
                color: '#7ed321',
                data: dataD,
                label: {
                    show: true,
                    position: 'top',
                    formatter: function (params) {
                        let i = params.dataIndex;
                        let text = `${totalScores[i]} 分`;
                        if (i === 0) text += '\n(有條件推進)';
                        if (i === 1) text += '\n(擱置)';
                        if (i === 2) text += '\n(擱置)';
                        if (i === 3) text += '\n(強制擱置)';
                        if (i === 4) text += '\n(警戒撤出)';
                        if (i === 5) text += '\n(暫定/待覆核)';
                        return text;
                    },
                    fontSize: 12,
                    fontWeight: 'bold',
                    color: '#333',
                    lineHeight: 16,
                    distance: 10
                }
            },
            {
                name: '客觀風險扣分',
                type: 'bar',
                stack: 'Total',
                color: '#d0021b',
                data: dataRisk,
                markLine: {
                    symbol: 'none',
                    data: [
                        {
                            yAxis: 80,
                            name: '80分 戰略推進門檻',
                            lineStyle: { color: '#e67e22', width: 2, type: 'dashed' },
                            label: { formatter: '80分 戰略推進門檻', position: 'end', color: '#e67e22', fontWeight: 'bold', padding: [0, 0, -15, 0] }
                        },
                        {
                            yAxis: 0,
                            lineStyle: { color: '#333333', width: 1.5, type: 'solid' }
                        }
                    ]
                }
            }
        ]
    };

    option && myChart.setOption(option);
    
    // 隨視窗大小改變自適應縮放
    window.addEventListener('resize', function() {
        myChart.resize();
    });
</script>

</body>
</html>
